<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Invitación de Graduación – Felipe & Sebastian</title>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #f5f0e8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Montserrat', sans-serif;
    }

    /* ── Confetti particles ── */
    .confetti-wrap {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }
    .dot {
      position: absolute;
      border-radius: 50%;
      opacity: .75;
      animation: fall linear infinite;
    }
    @keyframes fall {
      0%   { transform: translateY(-60px) rotate(0deg); opacity: .9; }
      100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
    }

    /* ── Card ── */
    .card {
      position: relative;
      z-index: 1;
      background: #faf6ed;
      border-radius: 28px;
      padding: 48px 40px 44px;
      max-width: 520px;
      width: 94vw;
      text-align: center;
      box-shadow: 0 12px 48px rgba(0,0,0,.12);
      overflow: hidden;
    }

    /* Balloon SVG top-left */
    .balloons {
      position: absolute;
      top: 18px;
      left: 18px;
      opacity: .55;
    }

    /* Squiggles */
    .squiggle {
      position: absolute;
      opacity: .35;
      font-size: 26px;
      font-weight: 900;
      color: #222;
    }
    .sq1  { top: 52%;  left:  6%;  transform: rotate(-30deg); }
    .sq2  { top: 68%;  left:  4%;  transform: rotate(20deg);  }
    .sq3  { top: 42%;  right: 5%;  transform: rotate(15deg);  }
    .sq4  { top: 60%;  right: 3%;  transform: rotate(-25deg); }
    .dot-dec {
      position: absolute;
      width: 8px; height: 8px;
      background: #222;
      border-radius: 50%;
      opacity: .5;
    }
    .dd1 { top: 44%; left: 12%; }
    .dd2 { top: 58%; left:  8%; }
    .dd3 { top: 72%; left: 14%; }
    .dd4 { top: 38%; right:10%; }
    .dd5 { top: 55%; right: 6%; }
    .dd6 { top: 70%; right:12%; }
    .dash {
      position: absolute;
      width: 18px; height: 4px;
      background: #222;
      border-radius: 3px;
      opacity: .4;
    }
    .dh1 { top: 50%; left:  5%; transform: rotate(30deg); }
    .dh2 { top: 65%; right: 7%; transform: rotate(-20deg); }

    /* ── Title ── */
    .title {
      font-size: clamp(18px, 4.5vw, 22px);
      font-weight: 900;
      letter-spacing: .12em;
      color: #1a1a1a;
      line-height: 1.3;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    /* ── Names ── */
    .names {
      font-family: 'Pacifico', cursive;
      font-size: clamp(30px, 8vw, 46px);
      background: linear-gradient(135deg, #e8a000, #f5c400);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 4px;
      text-shadow: none;
      filter: drop-shadow(1px 2px 2px rgba(180,100,0,.25));
    }

    /* ── Character image ── */
    .character {
      display: block;
      margin: 0 auto 12px;
      height: 230px;
      object-fit: contain;
      filter: drop-shadow(0 8px 18px rgba(0,0,0,.18));
      animation: float 3.6s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-10px); }
    }

    /* ── Date bar ── */
    .date-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      font-size: clamp(14px, 3.5vw, 18px);
      font-weight: 700;
      letter-spacing: .18em;
      color: #1a1a1a;
      margin-bottom: 8px;
    }
    .sep {
      display: inline-block;
      width: 2px;
      height: 22px;
      background: #1a1a1a;
      border-radius: 2px;
    }

    /* ── Address ── */
    .address {
      font-size: clamp(13px, 3vw, 15px);
      font-weight: 600;
      color: #444;
      margin-bottom: 22px;
      letter-spacing: .04em;
    }

    /* ── QR ── */
    .qr-wrap {
      display: inline-block;
      background: #fff;
      border: 3px solid #1a1a1a;
      border-radius: 14px;
      padding: 10px;
      margin-bottom: 6px;
    }
    .qr-wrap img {
      display: block;
      width: 120px;
      height: 120px;
      object-fit: contain;
    }
    .qr-label {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .06em;
      color: #333;
    }

    /* ── Balloon SVG ── */
    svg.balloon-svg { width: 70px; }
  </style>
</head>
<body>

<!-- Falling confetti -->
<div class="confetti-wrap" id="confetti"></div>

<div class="card">

  <!-- Decorative balloons -->
  <svg class="balloons balloon-svg" viewBox="0 0 80 120" fill="none" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="20" cy="28" rx="16" ry="20" fill="none" stroke="#222" stroke-width="2.5"/>
    <ellipse cx="42" cy="18" rx="16" ry="20" fill="none" stroke="#222" stroke-width="2.5"/>
    <ellipse cx="62" cy="30" rx="14" ry="18" fill="none" stroke="#222" stroke-width="2.5"/>
    <line x1="20" y1="48" x2="18" y2="115" stroke="#222" stroke-width="2" stroke-dasharray="3 3"/>
    <line x1="42" y1="38" x2="40" y2="115" stroke="#222" stroke-width="2" stroke-dasharray="3 3"/>
    <line x1="62" y1="48" x2="60" y2="115" stroke="#222" stroke-width="2" stroke-dasharray="3 3"/>
  </svg>

  <!-- Side decorations -->
  <span class="squiggle sq1">~</span>
  <span class="squiggle sq2">~</span>
  <span class="squiggle sq3">~</span>
  <span class="squiggle sq4">~</span>
  <div class="dot-dec dd1"></div>
  <div class="dot-dec dd2"></div>
  <div class="dot-dec dd3"></div>
  <div class="dot-dec dd4"></div>
  <div class="dot-dec dd5"></div>
  <div class="dot-dec dd6"></div>
  <div class="dash dh1"></div>
  <div class="dash dh2"></div>

  <p class="title">Te invitamos a nuestra<br>reunión de graduación</p>

  <div class="names">Felipe – Sebastian</div>

  <!--
    Guarda la imagen del personaje Minecraft graduado
    en la misma carpeta con el nombre: minecraft_grad.png
  -->
  <img
    class="character"
    src="minecraft_grad.png.png"
    alt="Steve de Minecraft graduado"
    onerror="this.style.display='none'"
  />

  <div class="date-bar">
    <span>JUNIO</span>
    <span class="sep"></span>
    <span>27</span>
    <span class="sep"></span>
    <span>5:00 PM</span>
  </div>

  <p class="address">Vía antigua a Cumaral</p>

  <!--
    Guarda la imagen del QR en la misma carpeta con el nombre: qr_ubicacion.png
  -->
  <div class="qr-wrap">
    <img src="qr_ubicacion.png.png" alt="QR Ubicación" onerror="this.src='https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=Via+antigua+a+Cumaral'" />
  </div>
  <p class="qr-label">Ubicación</p>
</div>

<script>
  // Generate falling confetti dots
  const colors = ['#f5c400','#e8a000','#222','#ff6b6b','#6bcfff','#b5ff6b'];
  const wrap = document.getElementById('confetti');
  for (let i = 0; i < 55; i++) {
    const d = document.createElement('div');
    d.className = 'dot';
    const size = 6 + Math.random() * 10;
    d.style.cssText = `
      left:${Math.random()*100}%;
      width:${size}px; height:${size}px;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      animation-duration:${3 + Math.random()*5}s;
      animation-delay:${Math.random()*6}s;
    `;
    wrap.appendChild(d);
  }
</script>
</body>
</html>
